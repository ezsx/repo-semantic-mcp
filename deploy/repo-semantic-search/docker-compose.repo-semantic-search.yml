name: repo-semantic-search

services:
  qdrant:
    image: "${SEMANTIC_MCP_QDRANT_IMAGE:-qdrant/qdrant:v1.17.1}"
    container_name: repo-semantic-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_repo_semantic_data:/qdrant/storage
    ports:
      - "${SEMANTIC_MCP_QDRANT_PORT:-6333}:6333"

  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    container_name: repo-semantic-tei
    restart: unless-stopped
    command:
      - "--model-id"
      - "${SEMANTIC_MCP_TEI_MODEL_ID:-intfloat/multilingual-e5-small}"
      - "--port"
      - "80"
    volumes:
      - tei_repo_semantic_cache:/data
    environment:
      HF_HOME: /data
      HUGGINGFACE_HUB_CACHE: /data
    ports:
      - "${SEMANTIC_MCP_TEI_PORT:-8081}:80"

  repo-semantic-mcp:
    build:
      context: ../..
      dockerfile: apps/repo-semantic-mcp/Dockerfile
    container_name: repo-semantic-mcp
    restart: unless-stopped
    depends_on:
      - qdrant
      - tei
    volumes:
      - "${SEMANTIC_MCP_TARGET_REPO_PATH:-../..}:/target_repo"
      - repo_semantic_registry_data:/state
    environment:
      PYTHONPATH: /repo:/repo/libs
      SEMANTIC_MCP_REPO_ROOT: "${SEMANTIC_MCP_REPO_ROOT:-/target_repo}"
      SEMANTIC_MCP_LOGICAL_REPO_ROOT: "${SEMANTIC_MCP_LOGICAL_REPO_ROOT:-}"
      SEMANTIC_MCP_QDRANT_URL: http://qdrant:6333
      SEMANTIC_MCP_REGISTRY_DB_PATH: /state/repo_semantic_registry.sqlite3
      SEMANTIC_MCP_COLLECTION_PREFIX: "${SEMANTIC_MCP_COLLECTION_PREFIX:-repo_semantic}"
      SEMANTIC_MCP_INDEX_SCHEMA_VERSION: "${SEMANTIC_MCP_INDEX_SCHEMA_VERSION:-3}"
      SEMANTIC_MCP_EMBEDDING_BACKEND: "${SEMANTIC_MCP_EMBEDDING_BACKEND:-tei_http}"
      SEMANTIC_MCP_EMBEDDING_BACKEND_ID: "${SEMANTIC_MCP_EMBEDDING_BACKEND_ID:-}"
      SEMANTIC_MCP_EMBEDDING_MODEL: "${SEMANTIC_MCP_EMBEDDING_MODEL:-intfloat/multilingual-e5-small}"
      SEMANTIC_MCP_PROFILE_NAME: "${SEMANTIC_MCP_PROFILE_NAME:-cpu_e5}"
      SEMANTIC_MCP_QUERY_TEMPLATE: "${SEMANTIC_MCP_QUERY_TEMPLATE:-query: {query}}"
      SEMANTIC_MCP_DOCUMENT_PREFIX: "${SEMANTIC_MCP_DOCUMENT_PREFIX-passage: }"
      SEMANTIC_MCP_TEI_URL: "${SEMANTIC_MCP_TEI_URL:-http://tei:80}"
      SEMANTIC_MCP_TEI_QUERY_PROMPT_NAME: "${SEMANTIC_MCP_TEI_QUERY_PROMPT_NAME-}"
      SEMANTIC_MCP_TEI_DOCUMENT_PROMPT_NAME: "${SEMANTIC_MCP_TEI_DOCUMENT_PROMPT_NAME-}"
      SEMANTIC_MCP_EMBEDDING_LOCATION_TYPE: "${SEMANTIC_MCP_EMBEDDING_LOCATION_TYPE:-unknown}"
      SEMANTIC_MCP_EMBEDDING_DEVICE_TYPE: "${SEMANTIC_MCP_EMBEDDING_DEVICE_TYPE:-unknown}"
      SEMANTIC_MCP_EMBEDDING_MANAGED_BY_SERVICE: "${SEMANTIC_MCP_EMBEDDING_MANAGED_BY_SERVICE:-0}"
      SEMANTIC_MCP_EMBEDDING_AUTOSTART_POLICY: "${SEMANTIC_MCP_EMBEDDING_AUTOSTART_POLICY:-manual}"
      SEMANTIC_MCP_EMBEDDING_HEALTH_PATH: "${SEMANTIC_MCP_EMBEDDING_HEALTH_PATH:-/health}"
      SEMANTIC_MCP_RERANKER_BACKEND: "${SEMANTIC_MCP_RERANKER_BACKEND:-custom_http}"
      SEMANTIC_MCP_RERANKER_BACKEND_ID: "${SEMANTIC_MCP_RERANKER_BACKEND_ID:-}"
      SEMANTIC_MCP_RERANKER_MODEL: "${SEMANTIC_MCP_RERANKER_MODEL:-}"
      SEMANTIC_MCP_RERANKER_URL: "${SEMANTIC_MCP_RERANKER_URL:-}"
      SEMANTIC_MCP_RERANKER_LOCATION_TYPE: "${SEMANTIC_MCP_RERANKER_LOCATION_TYPE:-unknown}"
      SEMANTIC_MCP_RERANKER_DEVICE_TYPE: "${SEMANTIC_MCP_RERANKER_DEVICE_TYPE:-unknown}"
      SEMANTIC_MCP_RERANKER_MANAGED_BY_SERVICE: "${SEMANTIC_MCP_RERANKER_MANAGED_BY_SERVICE:-0}"
      SEMANTIC_MCP_RERANKER_AUTOSTART_POLICY: "${SEMANTIC_MCP_RERANKER_AUTOSTART_POLICY:-manual}"
      SEMANTIC_MCP_RERANKER_HEALTH_PATH: "${SEMANTIC_MCP_RERANKER_HEALTH_PATH:-/health}"
      SEMANTIC_MCP_COLBERT_BACKEND: "${SEMANTIC_MCP_COLBERT_BACKEND:-custom_http}"
      SEMANTIC_MCP_COLBERT_BACKEND_ID: "${SEMANTIC_MCP_COLBERT_BACKEND_ID:-}"
      SEMANTIC_MCP_COLBERT_MODEL: "${SEMANTIC_MCP_COLBERT_MODEL:-}"
      SEMANTIC_MCP_COLBERT_URL: "${SEMANTIC_MCP_COLBERT_URL:-}"
      SEMANTIC_MCP_COLBERT_LOCATION_TYPE: "${SEMANTIC_MCP_COLBERT_LOCATION_TYPE:-unknown}"
      SEMANTIC_MCP_COLBERT_DEVICE_TYPE: "${SEMANTIC_MCP_COLBERT_DEVICE_TYPE:-unknown}"
      SEMANTIC_MCP_COLBERT_MANAGED_BY_SERVICE: "${SEMANTIC_MCP_COLBERT_MANAGED_BY_SERVICE:-0}"
      SEMANTIC_MCP_COLBERT_AUTOSTART_POLICY: "${SEMANTIC_MCP_COLBERT_AUTOSTART_POLICY:-manual}"
      SEMANTIC_MCP_COLBERT_HEALTH_PATH: "${SEMANTIC_MCP_COLBERT_HEALTH_PATH:-/health}"
      SEMANTIC_MCP_TRANSPORT: "${SEMANTIC_MCP_TRANSPORT:-http}"
      SEMANTIC_MCP_HTTP_HOST: 0.0.0.0
      SEMANTIC_MCP_HTTP_PORT: "${SEMANTIC_MCP_HTTP_PORT:-8011}"
      SEMANTIC_MCP_DEPENDENCY_WAIT_ATTEMPTS: "${SEMANTIC_MCP_DEPENDENCY_WAIT_ATTEMPTS:-90}"
      SEMANTIC_MCP_DEPENDENCY_WAIT_DELAY_SEC: "${SEMANTIC_MCP_DEPENDENCY_WAIT_DELAY_SEC:-2}"
      SEMANTIC_MCP_WATCH_ENABLED: "${SEMANTIC_MCP_WATCH_ENABLED:-1}"
      SEMANTIC_MCP_WATCH_DEBOUNCE_SEC: "${SEMANTIC_MCP_WATCH_DEBOUNCE_SEC:-3}"
      SEMANTIC_MCP_EMBED_BATCH_DOCS: "${SEMANTIC_MCP_EMBED_BATCH_DOCS:-24}"
      SEMANTIC_MCP_EMBED_BATCH_CHARS: "${SEMANTIC_MCP_EMBED_BATCH_CHARS:-12000}"
      SEMANTIC_MCP_MAX_CHUNK_CHARS: "${SEMANTIC_MCP_MAX_CHUNK_CHARS:-800}"
      SEMANTIC_MCP_LOG_LEVEL: "${SEMANTIC_MCP_LOG_LEVEL:-info}"
    ports:
      - "${SEMANTIC_MCP_HTTP_PORT:-8011}:${SEMANTIC_MCP_HTTP_PORT:-8011}"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import os, sys, urllib.request; url = f\"http://127.0.0.1:{os.environ.get('SEMANTIC_MCP_HTTP_PORT', '8011')}/readyz\"; sys.exit(0 if urllib.request.urlopen(url, timeout=20).status == 200 else 1)"
      interval: 15s
      timeout: 30s
      retries: 40
      start_period: 20s

volumes:
  qdrant_repo_semantic_data:
  tei_repo_semantic_cache:
  repo_semantic_registry_data:
